name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Hugging Face needs YAML frontmatter at the top of README.md to
      # configure the Space. It is added here, in the runner workspace
      # only, so the README on GitHub stays clean. Nothing is committed
      # back to the repository.
      - name: Add Space config to README for Hugging Face
        run: |
          if head -n 1 README.md | grep -q '^---$'; then
            echo "README already has frontmatter, leaving it unchanged."
            exit 0
          fi

          cat > hf-frontmatter.md <<'FRONTMATTER'
          ---
          title: RAG PDF Assistant
          emoji: 📄
          colorFrom: green
          colorTo: gray
          sdk: gradio
          sdk_version: 6.28.0
          app_file: app.py
          pinned: false
          ---

          FRONTMATTER

          cat hf-frontmatter.md README.md > README.hf.md
          mv README.hf.md README.md
          rm hf-frontmatter.md

          echo "Frontmatter added. README now starts with:"
          head -n 10 README.md

      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: no2004/rag-pdf-assistant
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
